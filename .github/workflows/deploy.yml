name: Pandora Deploy

on: push

jobs:
  test-fallo:
    runs-on: self-hosted

    outputs:
      hostname: ${{ steps.ver-servidor.outputs.hostname }}
      usuario: ${{ steps.ver-servidor.outputs.usuario }}

    steps:
      - name: Ver servidor
        id: ver-servidor
        run: |
          echo "hostname=$(hostname)" >> "$GITHUB_OUTPUT"
          echo "usuario=$(whoami)" >> "$GITHUB_OUTPUT"
    steps:
      - name: Fallo aproposito
        run: exit 1

  deploy:
    needs: test-fallo
    runs-on: self-hosted

    defaults:
      run:
        working-directory: /var/www/cotizador_app_django
    steps:
      - name: Verificar usuario
        if: needs.test-fallo.outputs.usuario == 'root'
        run: |
          echo "El usuario es root, no se puede ejecutar el despliegue."
          exit 1

      - name: BASH
        run: |
          if [ "${{ needs.test-fallo.outputs.usuario }}" != "root" ]; then
            echo "El usuario no es root, se puede ejecutar el despliegue."
          else
            echo "El usuario es root, no se puede ejecutar el despliegue."
            exit 1
          fi

      - name: Descargar cambios
        run: git pull

      - name: Build imagen
        run: docker compose up --build -d

      - name: COMPLETADO
        run: |
          echo "Despliegue completado con éxito."
          echo "Usuario: ${{ needs.test-fallo.outputs.usuario }}"
          echo "Servidor: ${{ needs.test-fallo.outputs.hostname }}"