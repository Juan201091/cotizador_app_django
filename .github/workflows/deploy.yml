name: Pandora Deploy

on: push

jobs:
  deploy:
    runs-on: self-hosted

    defaults:
      run:
        working-directory: /var/www/cotizador_app_django

    steps:
      - name: Ver usuario
        run: whoami

      - name: Descargar cambios
        run: git pull

      - name: Build imagen
        run: docker compose up --build -d